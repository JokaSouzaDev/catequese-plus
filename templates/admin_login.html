{% extends 'base.html' %}
{% block title %}Admin • Catequese+{% endblock %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">Área administrativa</span>
  <h1>Login ADM</h1>
  <p>Use a conta administrativa para permitir ou negar solicitações de acesso.</p>
  <form method="post">
    <label>E-mail
      <input name="email" type="email" required autocomplete="username">
    </label>
    <label>Senha
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Entrar como administrador</button>
  </form>
  <p class="muted"><a href="{{ url_for('login') }}">← Voltar ao login comum</a></p>
</section>
{% endblock %}
