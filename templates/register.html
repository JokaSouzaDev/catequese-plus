{% extends 'base.html' %}
{% block title %}Cadastro • Catequese+{% endblock %}
{% block content %}<section class="auth-card"><h1>Criar conta</h1><p>Cadastro exclusivo para catequistas.</p><form method="post"><label>Seu nome<input name="name" required></label><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" minlength="6" required></label><button class="btn" type="submit">Criar conta</button></form><p class="muted">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p></section>{% endblock %}
